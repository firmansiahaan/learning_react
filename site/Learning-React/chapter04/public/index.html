<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Web site created using create-react-app" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
            rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous" />
        <title>React Function Components</title>

        <!--
            * Before there were function components, there were other ways to create components.
            * While we won’t spend a great deal of time on these approaches, it’s important to
            * understand the history of React components, particularly when dealing with these
            * APIs in legacy codebases. Let’s take a little historical tour of 
            * React APIs of times gone by.
        -->
            
    </head>
    <body>
        <!-- Target container -->
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root" class="container"></div>
        
        <!-- Load React and ReactDOM -->
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

        <!-- Optional: Babel to use JSX -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        
        <!-- Bootstrap JS -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
        
        <script type="text/babel">
            const root = ReactDOM.createRoot(document.getElementById('root'));

            const secretIngredients = [
                "1 cup unsalted butter",
                "1 cup crunchy peanut butter",
                "1 cup brown sugar",
                "1 cup white sugar",
                "2 eggs",
                "2.5 cups all purpose flour",
                "1 teaspoon baking powder",
                "0.5 teaspoon salt",
                "2 lb salmon",
                "5 sprigs fresh rosemary",
                "2 tablespoons olive oil",
                "2 small lemons",
                "1 teaspoon kosher salt",
                "4 cloves of chopped garlic"
            ];

            //  destructuring items from props
            function IngredientsList({ items }) {
                return (
                    React.createElement("ul", { className: "ingredients" },
                        items.map((ingredient, i) =>
                            React.createElement("li", { key: i }, ingredient)
                        )
                    )
                );
            }

            const list = 
                React.createElement("section", { id: "baked-salmon" },
                    React.createElement("h1", null, "Baked Salmon"),
                        React.createElement(IngredientsList, { items: secretIngredients }),
                React.createElement("section", { className: "instructions" },
                    React.createElement("h2", null, "Cooking Instructions"),
                    React.createElement("p", null, "Preheat the oven to 375 degrees."),
                    React.createElement("p", null, "Lightly coat aluminum foil with oil."),
                    React.createElement("p", null, "Place salmon on foil."),
                    React.createElement("p",null,
                        "Cover with rosemary, sliced lemons, chopped garlic."),
                    React.createElement("p", null,
                        "Bake for 15-20 minutes until cooked through."),
                    React.createElement("p", null, "Remove from oven.")
                )
            );
            root.render(list);
            
        </script>

    </body>
</html>
