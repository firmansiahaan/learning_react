<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A simple reducer for a counter</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous" />       
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
            
    <!-- Load React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>


    <!-- Optional: Babel to use JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    
    <script type="text/babel">
      const initialState = 0;

      function reducer(state, action) {
        switch (action.type) {
          case 'increment':
            return state + 1;
          case 'decrement':
            return state - 1;
          case "add":
            return state + action.payload;
          case "sub":
            return state - action.payload;
          case "set":
            return action.payload;
          default:
            throw new Error('Unknown action type');
        }
      }

      function App() {
        const [state, dispatch] = React.useReducer(reducer, initialState);

        return (
          <>
            <h1>Counter: {state}</h1>
            <button className="btn btn-primary me-2" onClick={() => dispatch({type: 'increment'})}>Increment</button>
            <button className="btn btn-danger me-2" onClick={() => dispatch({type: 'decrement'})}>Decrement</button>
            <button className="btn btn-primary me-2" onClick={() => dispatch({type: 'add', payload: 5})}>Add 5</button>
            <button className="btn btn-danger me-2" onClick={() => dispatch({type: 'sub', payload: 5})}>Subtract 5</button>
            <button className="btn btn-primary" onClick={() => dispatch({type: 'set', payload: 100})}>Set to 100</button>
          </> 
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>

  </body>
</html>
